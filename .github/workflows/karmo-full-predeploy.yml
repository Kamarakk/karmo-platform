name: KARMO Full Predeploy

on:
  push:
    branches:
      - staging/karmo-full-predeploy-20260912
  pull_request:
    paths:
      - 'core-service/**'
      - 'worker-runtime/**'
      - 'core-v2-prototypes/**'
      - '.github/workflows/karmo-full-predeploy.yml'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run Core service suite
        working-directory: core-service
        run: python -m pytest -q tests

  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run Worker Runtime suite
        working-directory: worker-runtime
        run: python -m pytest -q tests

  core-v2-prototype-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Re-run proven Core v2 prototypes
        working-directory: core-v2-prototypes
        run: >-
          python -m pytest -q
          approval_engine config_poc failure_injection job_model run_evidence tool_registry
