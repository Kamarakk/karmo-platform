name: KARMO Full Predeploy

on:
  push:
    branches:
      - staging/karmo-full-predeploy-20260912
  pull_request:
    paths:
      - 'core-service/**'
      - 'worker-runtime/**'
      - 'worker-service/**'
      - 'core-v2-prototypes/**'
      - '.github/workflows/karmo-full-predeploy.yml'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: karmo_core_test
          POSTGRES_PASSWORD: karmo_core_test_synthetic_local_only
          POSTGRES_DB: karmo_core_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U karmo_core_test -d karmo_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KARMO_CORE_TEST_PG_HOST: 127.0.0.1
      KARMO_CORE_TEST_PG_PORT: 55434
      KARMO_CORE_TEST_PG_DB: karmo_core_test
      KARMO_CORE_TEST_PG_USER: karmo_core_test
      KARMO_CORE_TEST_PG_PASSWORD: karmo_core_test_synthetic_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest "psycopg[binary]" qdrant-client
      - name: Run Core service suite (includes real-PostgreSQL persistence tests)
        working-directory: core-service
        run: python -m pytest -q tests

  worker-service-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run Worker production-boundary suite
        env:
          PYTHONPATH: ${{ github.workspace }}/core-service:${{ github.workspace }}/worker-service
        run: python -m pytest -q worker-service/tests/test_worker_service.py
      - name: Verify worker health CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core-service:${{ github.workspace }}/worker-service
        run: python -m worker_service health

  worker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run Worker Runtime suite
        working-directory: worker-runtime
        run: python -m pytest -q tests

  core-v2-prototype-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Re-run proven Core v2 prototypes
        working-directory: core-v2-prototypes
        run: >-
          python -m pytest -q
          approval_engine config_poc failure_injection job_model run_evidence tool_registry
